apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: taskflow-db
  namespace: taskflow
spec:
  serviceName: taskflow-db-headless
  replicas: 1

  selector:
    matchLabels:
      app: taskflow-db

  template:
    metadata:
      labels:
        app: taskflow-db

    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-secret
                  key: POSTGRES_DB

            # Store database files inside a subdirectory of the volume
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            # Persistent database storage
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            # Initial database schema
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/schema.sql
              subPath: schema.sql
              readOnly: true

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: schema
          configMap:
            name: taskflow-db-schema
        - name: postgres-data
          hostPath:
            path: /home/zane/personal/todo-list/taskflow-todolist-project/.data/postgres
            type: DirectoryOrCreate
